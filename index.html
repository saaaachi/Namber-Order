<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Order - 脳トレ！数字順タップ</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1299640300068792" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; touch-action: none; }
        body { background: #e8f5e9; font-family: 'Hiragino Sans', 'Meiryo', sans-serif; display: flex; flex-direction: column; color: #333; }
        
        /* 上部広告：100px 固定 */
        #ad-top { width: 100%; height: 100px; background: #333; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 100; border-bottom: 2px solid #4caf50; }

        /* ゲームエリア */
        #game-outer { flex-grow: 1; position: relative; width: 100%; background: #f1f8e9; overflow: hidden; }
        #game-area { width: 100%; height: 100%; position: relative; }
        
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: #2e7d32; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 0 white; }

        /* 数字のデザイン */
        .num-circle { 
            position: absolute; width: 65px; height: 65px; background: #4caf50; color: white; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 28px; font-weight: bold; cursor: pointer; box-shadow: 0 5px #2e7d32;
            transition: transform 0.1s, opacity 0.2s;
        }
        .num-circle:active { transform: scale(0.9); box-shadow: 0 2px #2e7d32; }
        .correct-hit { animation: hit-anim 0.3s ease-out forwards; }
        @keyframes hit-anim { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* メニュー画面 */
        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.96); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 500; padding: 20px;
        }

        /* 収益の柱：レクタングル広告 */
        #ad-middle-box {
            width: 300px; height: 250px; background: #eee;
            margin: 15px 0; display: none; justify-content: center; align-items: center;
            border: 1px solid #ccc; border-radius: 10px; overflow: hidden;
        }
        
        .btn-group { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
        .menu-btn { width: 280px; padding: 18px; font-size: 20px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; transition: 0.2s; }
        #goButton { background: #4caf50; color: white; box-shadow: 0 5px #2e7d32; }
        #goButton:disabled { background: #bbb; box-shadow: none; color: #777; }
        .sub-btn { background: #ff4081; color: white; box-shadow: 0 5px #c2185b; font-size: 16px; }

        /* インタースティシャル */
        #inter-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 99999; align-items: center; justify-content: center; }
        .inter-content { width: 330px; height: 350px; background: #fff; position: relative; border-radius: 15px; }
        #close-ad-btn { position: absolute; top: -55px; right: 0; width: 45px; height: 45px; background: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #fff; cursor: pointer; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="ad-top">
        <ins class="adsbygoogle" style="display:inline-block;width:320px;height:100px" data-ad-client="ca-pub-1299640300068792" data-ad-slot="3972022911"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div id="game-outer">
        <div id="ui">NEXT: 1</div>
        
        <div id="menuScreen">
            <div style="text-align:center;">
                <h1 id="menuTitle" style="color:#2e7d32; margin:0; font-size: 32px;">Number Order</h1>
                <p id="menuMsg" style="margin:5px 0; color: #666;">1から順番に叩け！</p>
                <div style="color: #2e7d32; font-size: 20px; font-weight: bold; margin: 5px 0;">SCORE: <span id="current-score">0</span></div>
            </div>

            <div id="ad-middle-box">
                <ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px" data-ad-client="ca-pub-1299640300068792" data-ad-slot="9050127185"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <div class="btn-group">
                <button id="goButton" class="menu-btn" onclick="startNewGame()">スタート！</button>
                <a href="https://saaaachi.github.io/" class="sub-btn menu-btn">他の脳トレで遊ぶ</a>
            </div>
        </div>
        
        <div id="game-area"></div>

        <div id="inter-screen">
            <div class="inter-content">
                <div id="close-ad-btn" onclick="closeInterAd()">5</div>
                <iframe id="ifr-inter" src="about:blank" style="width:100%; height:100%; border:none; border-radius:15px; background:#fff;"></iframe>
            </div>
        </div>
    </div>

    <script>
        const area = document.getElementById("game-area"), ui = document.getElementById("ui"),
              menuScreen = document.getElementById("menuScreen"), menuTitle = document.getElementById("menuTitle"),
              menuMsg = document.getElementById("menuMsg"), currentScore = document.getElementById("current-score"),
              goButton = document.getElementById("goButton"), adMid = document.getElementById("ad-middle-box");

        let score = 0, nextNum = 1, gameActive = false, timer, playCount = 0;

        function startNewGame() {
            menuScreen.style.display = "none";
            adMid.style.display = "none";
            score = 0; nextNum = 1; gameActive = true;
            ui.innerText = "NEXT: 1";
            spawnNumbers();
        }

        function spawnNumbers() {
            area.innerHTML = "";
            let count = Math.min(5 + Math.floor(score / 2), 15); // 数が増える
            
            for(let i = 0; i < count; i++) {
                const n = document.createElement("div");
                n.className = "num-circle";
                n.innerText = i + 1;
                
                // 重なりを減らすための簡易ランダム配置
                const x = 20 + Math.random() * (area.clientWidth - 100);
                const y = 20 + Math.random() * (area.clientHeight - 100);
                n.style.left = x + "px";
                n.style.top = y + "px";
                
                // イベント登録
                const touchHandler = (e) => {
                    e.preventDefault();
                    tapNum(i + 1, n);
                };
                n.addEventListener("touchstart", touchHandler, {passive: false});
                n.addEventListener("click", () => tapNum(i + 1, n));
                
                area.appendChild(n);
            }
            clearTimeout(timer);
            // 制限時間（数が増えるほど少し猶予を与える）
            timer = setTimeout(() => { gameOver("時間切れ！⏳"); }, 3500 + (count * 300));
        }

        function tapNum(num, el) {
            if(!gameActive || el.classList.contains("correct-hit")) return;
            
            if(num === nextNum) {
                el.classList.add("correct-hit");
                nextNum++;
                let total = area.querySelectorAll('.num-circle').length;
                if(nextNum > total) {
                    score++;
                    nextNum = 1;
                    ui.innerText = "クリア！次へ...";
                    setTimeout(spawnNumbers, 300);
                } else {
                    ui.innerText = "NEXT: " + nextNum;
                }
            } else {
                gameOver("順番がちがうよ！❌");
            }
        }

        function gameOver(msg) {
            gameActive = false;
            clearTimeout(timer);
            playCount++;

            menuTitle.innerText = msg;
            menuTitle.style.color = "#d32f2f";
            currentScore.innerText = score;
            goButton.innerText = "お待ちください...";
            goButton.disabled = true;

            adMid.style.display = "flex"; 
            menuScreen.style.display = "flex";

            setTimeout(() => {
                goButton.disabled = false;
                goButton.innerText = "もう一度挑戦！";
            }, 1500);

            if(playCount % 3 === 0) setTimeout(showInterAd, 600);
        }

        function showInterAd() {
            const screen = document.getElementById("inter-screen"), 
                  closeBtn = document.getElementById("close-ad-btn"), 
                  ifr = document.getElementById('ifr-inter');
            ifr.src = './ad.large.html?v=' + Date.now();
            screen.style.display = "flex";
            let count = 5;
            closeBtn.innerText = count;
            closeBtn.style.pointerEvents = "none";
            const itv = setInterval(() => {
                count--;
                if(count > 0) closeBtn.innerText = count;
                else {
                    clearInterval(itv);
                    closeBtn.innerText = "×";
                    closeBtn.style.pointerEvents = "auto";
                }
            }, 1000);
        }

        function closeInterAd() {
            document.getElementById("inter-screen").style.display = "none";
            document.getElementById('ifr-inter').src = 'about:blank';
        }
    </script>
</body>
</html>
